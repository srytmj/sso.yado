name: sso-yado

# Production compose untuk homelab (Proxmox + banyak project Docker di 1 host).
# Beda dari docker-compose.yml (dev):
#   - Tidak mount source code — kode di-bake ke image saat build
#   - Join network eksternal "proxy" (Traefik) alih-alih expose port langsung
#   - restart: unless-stopped + healthcheck
#   - migrate (bukan migrate:fresh) saat update — data tidak boleh hilang
#
# Pakai: make docker-prod-deploy (atau manual: docker compose -f docker/compose.prod.yml
# --project-directory . up -d --build — flag --project-directory WAJIB supaya semua path
# relatif di file ini tetap resolve ke root repo, bukan ke folder docker/)

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - sso_storage:/var/www/html/storage
      - sso_public:/var/www/html/public
      - ./.env:/var/www/html/.env
    env_file: .env
    environment:
      # Project ini pakai read/write split (lihat config/database.php) — DB_HOST saja
      # tidak cukup, DB_READ_HOST/DB_WRITE_HOST eksplisit di .env akan menang atas
      # fallback ke DB_HOST kalau tidak di-override juga di sini.
      DB_HOST: postgres
      DB_READ_HOST: postgres
      DB_WRITE_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sso
      - proxy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - sso_public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sso
      - proxy
    labels:
      # Traefik v2/v3 — sesuaikan Host() dan certresolver dengan setup Traefik kamu
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.sso.rule=Host(`sso.yado.my.id`)"
      - "traefik.http.routers.sso.entrypoints=websecure"
      - "traefik.http.routers.sso.tls.certresolver=letsencrypt"
      - "traefik.http.services.sso.loadbalancer.server.port=80"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Beda dari MySQL: image Postgres resmi tidak punya konsep root+user terpisah,
      # cuma 1 superuser yang dibuat dari POSTGRES_USER/POSTGRES_PASSWORD — jadi ini
      # HARUS sama persis dengan DB_USERNAME/DB_PASSWORD yang dipakai aplikasi.
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: db_sso
    volumes:
      - sso_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sso

volumes:
  sso_postgres_data:
  sso_storage:
  sso_public:

networks:
  sso:
    name: yado_sso_prod
  proxy:
    external: true
    name: proxy
