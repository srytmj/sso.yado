name: sso-yado

# Standalone: self-contained (tidak butuh network eksternal seperti Traefik), pakai
# Caddy sebagai reverse proxy. Satu file yang sama untuk dua skenario:
#
#   - Testing/pakai lokal:  CADDY_SITE_ADDRESS=http://localhost (default)  -> akses http://localhost
#   - Deploy publik:        CADDY_SITE_ADDRESS=sso.namadomain.com          -> Caddy otomatis provision
#                            HTTPS via Let's Encrypt, tidak perlu setup manual apa pun
#
# PENTING: JANGAN taruh port di CADDY_SITE_ADDRESS (mis. "http://localhost:8080") kalau
# HTTP_PORT sudah diganti dari default 80 — Caddy akan listen di port yang disebut DI
# DALAM alamat itu (jadi 8080 di dalam container), sementara mapping HTTP_PORT tetap
# mengarah ke port 80 container. Ganti port host cukup lewat HTTP_PORT/HTTPS_PORT saja,
# biarkan CADDY_SITE_ADDRESS tanpa port.
#
# Pakai: make docker-standalone-deploy (atau manual: docker compose -f
# docker/compose.standalone.yml --project-directory . up -d --build — flag
# --project-directory WAJIB supaya semua path relatif di file ini tetap resolve ke
# root repo, bukan ke folder docker/)

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - sso_storage:/var/www/html/storage
      - sso_public:/var/www/html/public
      - ./.env:/var/www/html/.env
    env_file: .env
    environment:
      # Project ini pakai read/write split (lihat config/database.php) — DB_HOST saja
      # tidak cukup, DB_READ_HOST/DB_WRITE_HOST eksplisit di .env akan menang atas
      # fallback ke DB_HOST kalau tidak di-override juga di sini.
      DB_HOST: postgres
      DB_READ_HOST: postgres
      DB_WRITE_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sso

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-http://localhost}
    volumes:
      - sso_public:/var/www/html/public:ro
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - sso

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Beda dari MySQL: image Postgres resmi tidak punya konsep root+user terpisah,
      # cuma 1 superuser yang dibuat dari POSTGRES_USER/POSTGRES_PASSWORD — jadi ini
      # HARUS sama persis dengan DB_USERNAME/DB_PASSWORD yang dipakai aplikasi.
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: db_sso
    volumes:
      - sso_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sso

volumes:
  sso_postgres_data:
  sso_storage:
  sso_public:
  caddy_data:
  caddy_config:

networks:
  sso:
    name: yado_sso_standalone
